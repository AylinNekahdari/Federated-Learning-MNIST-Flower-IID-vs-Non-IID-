[project]
name = "mnist-flower-app"
version = "0.1.0"
description = "MNIST federated learning with Flower App"
dependencies = [
    "flwr[simulation]>=1.25.0",
    "torch",
    "torchvision",
    "matplotlib"
]

[tool.flwr.app]
publisher = "aylin"

[tool.flwr.app.components]
serverapp = "server:app"
clientapp = "client:app"

[tool.flwr.app.config]
num-rounds = 10

[tool.setuptools.packages.find]
include = ["client*", "server*", "model*", "dataset*", "train*"]

[tool.flwr.federations.local-simulation]
options.num-supernodes = 10

